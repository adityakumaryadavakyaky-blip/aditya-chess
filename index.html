<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#152238">
<title>Aditya Chess</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard.js/1.0.0/chessboard-1.0.0.min.css">
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; background:linear-gradient(160deg,#101827,#1d3150); color:#f8fafc;
 font-family:system-ui,-apple-system,Segoe UI,sans-serif; display:flex; justify-content:center; }
main { width:min(100%,560px); padding:22px 16px 30px; }
header { text-align:center; margin:4px 0 18px; }
h1 { margin:0; font-size:28px; letter-spacing:.3px; }
.sub { color:#b9c7da; margin-top:5px; font-size:14px; }
.panel { background:#24364f; border:1px solid #3c506c; border-radius:18px; padding:14px; box-shadow:0 12px 30px #0004; }
#status { text-align:center; font-weight:650; padding:3px 4px 14px; min-height:42px; }
#board { width:100%; max-width:500px; margin:auto; touch-action:manipulation; }
.buttons { display:flex; gap:10px; margin-top:16px; }
button { flex:1; border:0; border-radius:12px; padding:13px 10px; font-size:15px; font-weight:700; color:#102033; background:#f0c66b; }
button.secondary { color:#f8fafc; background:#405875; }
.note { text-align:center; color:#bac8d9; font-size:12px; margin-top:14px; line-height:1.5; }
@media (max-width:360px) { main {padding:14px 10px;} h1{font-size:24px;} }
</style>
</head>
<body>
<main>
<header><h1>♟ Aditya Chess</h1><div class="sub">Two-player chess · Pass the phone and play</div></header>
<section class="panel">
  <div id="status" aria-live="polite">Loading chess…</div>
  <div id="board"></div>
  <div class="buttons">
    <button id="undo" class="secondary">↶ Undo</button>
    <button id="restart">↻ New game</button>
  </div>
  <div class="note">Tap or drag a piece to move it. Pawns promote to queens automatically.</div>
</section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/1.0.0/chess.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard.js/1.0.0/chessboard-1.0.0.min.js"></script>
<script>
(function () {
  const statusEl = document.getElementById('status');
  if (!window.Chess || !window.Chessboard || !window.jQuery) {
    statusEl.textContent = 'Could not load chess components. Please check your internet connection and reopen the app.';
    return;
  }
  const game = new Chess();
  const board = Chessboard('board', {
    position: 'start',
    draggable: true,
    pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
    onDragStart: function (source, piece) {
      if (game.isGameOver()) return false;
      if ((game.turn() === 'w' && piece.startsWith('b')) ||
          (game.turn() === 'b' && piece.startsWith('w'))) return false;
    },
    onDrop: function (source, target) {
      const move = game.move({ from: source, to: target, promotion: 'q' });
      if (move === null) return 'snapback';
      updateStatus();
    },
    onSnapEnd: function () { board.position(game.fen()); }
  });

  function updateStatus() {
    let text;
    if (game.isCheckmate()) text = 'Checkmate! ' + (game.turn() === 'w' ? 'Black' : 'White') + ' wins.';
    else if (game.isDraw()) text = 'Draw — game over.';
    else {
      text = (game.turn() === 'w' ? 'White' : 'Black') + ' to move';
      if (game.isCheck()) text += ' · Check!';
    }
    statusEl.textContent = text;
  }

  document.getElementById('undo').addEventListener('click', function () {
    game.undo();
    board.position(game.fen());
    updateStatus();
  });
  document.getElementById('restart').addEventListener('click', function () {
    game.reset();
    board.start();
    updateStatus();
  });
  window.addEventListener('resize', function () { board.resize(); });
  updateStatus();
})();
</script>
</body>
</html>
